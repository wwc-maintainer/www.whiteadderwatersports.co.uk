repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main"]
      - id: check-merge-conflict
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: formatter
        name: Format Everything with Oxfmt and Prettier
        language: system
        files: ^.*$
        entry: |
          sh -c 'pnpm run format' --
      - id: linter
        name: Lint everything with Oxlint
        language: system
        files: ^.*$
        entry: |
          sh -c 'pnpm run lint' --
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
